name: LinkedIn Daily Post

on:
  schedule:
    - cron: "30 7 * * 1,3,5"   # Lunedì, Mercoledì, Venerdì 08:30 ora italiana (estate)
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema del post (lascia vuoto per automatico)"
        required: false
        default: ""

jobs:
  generate-and-approve:
    name: Genera post e attendi approvazione
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze Python
        run: pip install -r automation/requirements.txt

      - name: Installa Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Genera contenuto e invia su Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
        run: python automation/generate_post.py

      - name: Attendi approvazione e pubblica
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: "126484360"
          LINKEDIN_ORG_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ORG_ACCESS_TOKEN }}
          TELEGRAM_POLL_MINUTES: "300"
        run: python automation/telegram_bot.py

      - name: Salva storico post nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/post_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: aggiorna storico post [skip ci]"
          git push origin HEAD:main || true
