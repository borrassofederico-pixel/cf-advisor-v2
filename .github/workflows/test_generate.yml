name: Test Generazione Contenuti

on:
  push:
    paths:
      - "automation/.run_gen_test"
  workflow_dispatch:

jobs:
  test-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - run: playwright install chromium --with-deps
      - name: Genera (senza pubblicare)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/test_generate.py
