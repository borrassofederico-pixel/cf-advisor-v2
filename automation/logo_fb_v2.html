<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e8e8;
    display: flex;
    gap: 48px;
    padding: 60px;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .label {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     VARIANTE A
     F e B condividono il montante verticale.
     La B abbraccia la F da destra.
     Navy + taglio dorato diagonale.
═══════════════════════════════════════════════════════ -->
<div class="card">
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- clip diagonale che "taglia" il logo a metà per il bicolore -->
      <clipPath id="clipGold">
        <polygon points="120,300 300,120 300,300"/>
      </clipPath>
      <clipPath id="clipNavy">
        <polygon points="0,0 300,0 300,120 120,300 0,300"/>
      </clipPath>
    </defs>

    <!-- sfondo -->
    <rect width="300" height="300" fill="#0a1628"/>

    <!-- cornice interna sottile oro -->
    <rect x="16" y="16" width="268" height="268" fill="none" stroke="#c4a050" stroke-width="0.8" opacity="0.5"/>

    <!-- ── MONOGRAMMA CONDIVISO ──
         Il montante verticale è uno solo, condiviso tra F e B.
         F usa barre orizzontali a sinistra,
         B usa due mezze ellissi a destra.
    -->
    <g transform="translate(150,150)">

      <!-- montante verticale condiviso -->
      <rect x="-14" y="-82" width="28" height="164" fill="#ffffff"/>

      <!-- barre orizzontali della F (solo a sinistra del montante) -->
      <!-- barra top -->
      <rect x="-52" y="-82" width="38" height="22" fill="#ffffff"/>
      <!-- barra media -->
      <rect x="-52" y="-11" width="30" height="18" fill="#ffffff"/>

      <!-- mezza ellisse superiore della B (a destra) -->
      <path d="M14,-82 Q72,-82 72,-27 Q72,28 14,28 L14,6 Q52,6 52,-27 Q52,-60 14,-60 Z" fill="#c4a050"/>
      <!-- mezza ellisse inferiore della B (a destra) -->
      <path d="M14,28 Q80,28 80,55 Q80,82 14,82 L14,60 Q58,60 58,55 Q58,50 14,50 Z" fill="#c4a050"/>

    </g>
  </svg>
  <div class="label">A — Montante condiviso</div>
</div>


<!-- ══════════════════════════════════════════════════════
     VARIANTE B
     F e B si sovrappongono con trasparenza.
     La B è ruotata di 180° e specchiata,
     creando una forma simmetrica a mosaico.
     Sfondo bianco, puro gioco di forme.
═══════════════════════════════════════════════════════ -->
<div class="card">
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="sq">
        <rect x="20" y="20" width="260" height="260"/>
      </clipPath>
    </defs>

    <rect width="300" height="300" fill="#ffffff"/>
    <rect x="1" y="1" width="298" height="298" fill="none" stroke="#e0e0e0" stroke-width="1"/>

    <!-- F geometrica navy, centrata a sinistra -->
    <g clip-path="url(#sq)">
      <!-- montante F -->
      <rect x="72" y="68" width="22" height="164" fill="#1a2744"/>
      <!-- barra top F -->
      <rect x="72" y="68" width="86" height="22" fill="#1a2744"/>
      <!-- barra media F -->
      <rect x="72" y="139" width="64" height="18" fill="#1a2744"/>

      <!-- B geometrica oro, allineata -->
      <!-- montante B (stesso montante della F, si fondono) -->
      <!-- bumpo superiore B -->
      <path d="M94,68 L158,68 Q196,68 196,107 Q196,146 158,146 L94,146 Z"
            fill="#c4a050" opacity="0.88"/>
      <!-- bumpo inferiore B -->
      <path d="M94,146 L162,146 Q206,146 206,174 Q206,210 162,210 L94,210 Z"
            fill="#c4a050" opacity="0.88"/>

      <!-- montante B oro sopra tutto -->
      <rect x="94" y="68" width="20" height="142" fill="#c4a050"/>
    </g>

  </svg>
  <div class="label">B — Sovrapposizione navy/oro</div>
</div>


<!-- ══════════════════════════════════════════════════════
     VARIANTE C
     Le due lettere inscribed in un cerchio navy.
     La F e la B si "baciano": il bordo destro della F
     tocca il bordo sinistro della B.
     Spazio negativo bianco attorno.
═══════════════════════════════════════════════════════ -->
<div class="card">
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="circClip">
        <circle cx="150" cy="150" r="118"/>
      </clipPath>
    </defs>

    <rect width="300" height="300" fill="#f5f5f5"/>

    <!-- cerchio navy -->
    <circle cx="150" cy="150" r="118" fill="#0a1628"/>
    <!-- anello oro sottile -->
    <circle cx="150" cy="150" r="118" fill="none" stroke="#c4a050" stroke-width="2"/>

    <g clip-path="url(#circClip)">

      <!-- F bianca a sinistra del centro -->
      <!-- montante F -->
      <rect x="52" y="72" width="20" height="156" fill="white"/>
      <!-- barra top -->
      <rect x="52" y="72" width="74" height="20" fill="white"/>
      <!-- barra media -->
      <rect x="52" y="140" width="55" height="16" fill="white"/>

      <!-- B oro a destra del centro, montante tocca la F -->
      <!-- montante B -->
      <rect x="138" y="72" width="20" height="156" fill="#c4a050"/>
      <!-- bump sup -->
      <path d="M158,72 Q210,72 210,111 Q210,152 158,152 L158,136 Q192,136 192,111 Q192,88 158,88 Z" fill="#c4a050"/>
      <!-- bump inf -->
      <path d="M158,152 Q216,152 216,179 Q216,228 158,228 L158,212 Q198,212 198,179 Q198,166 158,166 Z" fill="#c4a050"/>

    </g>

  </svg>
  <div class="label">C — Cerchio, F bianca + B oro</div>
</div>


<!-- ══════════════════════════════════════════════════════
     VARIANTE D
     Minimalismo geometrico estremo.
     Le due lettere ridotte a puri segmenti e archi.
     Sfondo navy, tratti bianchi e oro.
     Quasi un'icona astratta.
═══════════════════════════════════════════════════════ -->
<div class="card">
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

    <rect width="300" height="300" fill="#0a1628"/>

    <!-- cornice quadrata oro -->
    <rect x="28" y="28" width="244" height="244" fill="none" stroke="#c4a050" stroke-width="1.5"/>

    <!-- ── F come puri segmenti bianchi, stroke only ── -->
    <g stroke="white" stroke-width="8" stroke-linecap="square" fill="none">
      <!-- montante verticale F -->
      <line x1="86" y1="78" x2="86" y2="222"/>
      <!-- barra top F -->
      <line x1="86" y1="78" x2="152" y2="78"/>
      <!-- barra media F -->
      <line x1="86" y1="150" x2="140" y2="150"/>
    </g>

    <!-- ── B come archi oro, stroke only ── -->
    <g stroke="#c4a050" stroke-width="8" stroke-linecap="square" fill="none">
      <!-- montante B (continua il montante F con colore oro) -->
      <line x1="158" y1="78" x2="158" y2="222"/>
      <!-- arco superiore B -->
      <path d="M158,78 Q218,78 218,114 Q218,150 158,150"/>
      <!-- arco inferiore B -->
      <path d="M158,150 Q226,150 226,186 Q226,222 158,222"/>
    </g>

    <!-- punto di contatto F-B: linea sottile oro che le unisce -->
    <line x1="86" y1="150" x2="158" y2="150" stroke="#c4a050" stroke-width="1" opacity="0.5"/>

  </svg>
  <div class="label">D — Geometrico, solo tratti</div>
</div>

</body>
</html>
